<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="themeToggle" class="theme-toggle" title="Switch theme" aria-label="Switch theme">
  <!-- Moon icon (shown in light mode) -->
  <svg class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>

  <!-- Sun icon (shown in dark mode) -->
  <svg class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4" />
    <line x1="12" y1="2"  x2="12" y2="4"  />
    <line x1="12" y1="20" x2="12" y2="22" />
    <line x1="4"  y1="12" x2="2"  y2="12" />
    <line x1="22" y1="12" x2="20" y2="12" />
    <line x1="19.07" y1="4.93" x2="17.66" y2="6.34" />
    <line x1="6.34"  y1="17.66" x2="4.93" y2="19.07" />
    <line x1="19.07" y1="19.07" x2="17.66" y2="17.66" />
    <line x1="6.34"  y1="6.34"  x2="4.93" y2="4.93" />
  </svg>
</button>

  <div id="calculator" class="calculator">

    <div id="display" class="display">
      <div id="previousOperand" class="previous-operand"></div>
      <div id="currentOperand" class="current-operand">0</div>
    </div>

    <div id="buttons" class="buttons">

      <!-- Row 1 -->
      <button id="btnClear"    class="btn btn-clear span-two"  data-action="clear">AC</button>
      <button id="btnDelete"   class="btn btn-delete"          data-action="delete">DEL</button>
      <button id="btnDivide"   class="btn btn-operator"        data-action="operator" data-value="/">÷</button>

      <!-- Row 2 -->
      <button id="btn7"        class="btn btn-number" data-value="7">7</button>
      <button id="btn8"        class="btn btn-number" data-value="8">8</button>
      <button id="btn9"        class="btn btn-number" data-value="9">9</button>
      <button id="btnMultiply" class="btn btn-operator" data-action="operator" data-value="*">×</button>

      <!-- Row 3 -->
      <button id="btn4"        class="btn btn-number" data-value="4">4</button>
      <button id="btn5"        class="btn btn-number" data-value="5">5</button>
      <button id="btn6"        class="btn btn-number" data-value="6">6</button>
      <button id="btnSubtract" class="btn btn-operator" data-action="operator" data-value="-">−</button>

      <!-- Row 4 -->
      <button id="btn1"        class="btn btn-number" data-value="1">1</button>
      <button id="btn2"        class="btn btn-number" data-value="2">2</button>
      <button id="btn3"        class="btn btn-number" data-value="3">3</button>
      <button id="btnAdd"      class="btn btn-operator" data-action="operator" data-value="+">+</button>

      <!-- Row 5 -->
      <button id="btn0"        class="btn btn-number" data-value="0">0</button>
      <button id="btnDecimal"  class="btn btn-number" data-value=".">.</button>
      <button id="btnEquals"   class="btn btn-equals span-two" data-action="equals">=</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
